server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA routes on the hash fragment, so only /, /config.js and the hashed
    # asset files are ever requested. try_files still covers deep links.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Runtime config is regenerated on every container start; never cache it.
    location = /config.js {
        add_header Cache-Control "no-store, must-revalidate";
        expires -1;
    }

    # Vite emits content-hashed filenames, so these are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
